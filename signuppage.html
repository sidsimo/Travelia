<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="signuppage.css">
    <link rel="apple-touch-icon" href="images/airplane.png">
    <link rel="icon" href="images/airplane.png">
    <link rel="shortcut icon" href="images/airplane.png" type="image/x-icon">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="author" content="Jems Divin">
    <meta name="theme-color" content="#02102a">
</head>
<body>
    <div class="loginform">
        <form action="principalepage.html" method="post" enctype="application/x-www-form-urlencoded" id="form">
            <div class="inside_global_form">
                <img src="images/airplane.png" alt="" sizes="" srcset="" id="img_form">
            </div>
            <h1>Travelia Manager</h1>
            <p id="para">Sign up to your admin account</p>
            <label for="text" id="label_text">Username</label>
            <div class="username_form">
                <div class="inside_username_form1">
                    <img src="images/user.png" alt="" sizes="" srcset="" id="img_user">
                </div>
                <div class="inside_username_form2">
                    <input type="text" name="text" id="text" placeholder="Enter your username" autofocus required>
                </div>
            </div>
            <label for="text" id="label_text">Email</label>
            <div class="username_email_form">
                <div class="inside_username_email_form1">
                    <img src="images/envelope (1).png" alt="" sizes="" srcset="" id="img_user_email">
                </div>
                <div class="inside_username_email_form2">
                    <input type="email" name="email" id="email" placeholder="Enter your email address" autocomplete="on" required>
                </div>
            </div>
            <label for="password" id="label_pass">Password</label>
            <div class="password_form">
                <div class="inside_password_form1">
                    <img src="images/lock.png" alt="" sizes="" srcset="" id="img_pass">
                </div>
                <div class="inside_password_form2">
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                </div>
            </div>
            <button type="submit" id="btn" title="Sign up">Sign Up</button>
            <hr id="hr">
            <div class="foot_form">
                <img src="images/arrow-to-left-stroke.png" alt="" sizes="" srcset="" id="img_foot_form" title="backwards">
                <h3>Back to Website</h3>
            </div>
        </form>
    </div>
    <script type="text/javascript" src="signuppage.js"></script>
</body>
</html>
